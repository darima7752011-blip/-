function highlight(text, q) {
  if (!q) return text;

/* платформы/технологии — выводятся из портфеля компании (без выдумок) */
function platformsFor(c){
  const t=new Set();
  const txt=((c.keyProducts||[]).join(' ')+' '+(c.therapeuticAreas||[]).join(' ')+' '+(c.note||'')+' '+(c.status||'')).toLowerCase();
  if(/антител|моноклональ/.test(txt)) t.add('Моноклональные антитела');
  if(/инсулин/.test(txt)) t.add('Инсулины');
  if(/пептид/.test(txt)) t.add('Пептиды');
  if((c.segments||[]).includes('Вакцины')||/вакцин/.test(txt)) t.add('Вакцины');
  if(/фактор|плазм|крови/.test(txt)) t.add('Препараты крови');
  if((c.segments||[]).includes('Биотех')) t.add('Биотехнология (клеточные культуры)');
  if(/субстан|\bафи\b/.test(txt)||/активный компонент/.test(c.name.toLowerCase())) t.add('Синтез АФИ/субстанций');
  if(/инфузи|раствор|ампул/.test(txt)) t.add('Стерильные/инфузионные формы');
  if((c.segments||[]).some(s=>['Дженерики','Рецептурные','OTC'].includes(s))) t.add('Малые молекулы (хим. синтез)');
  return [...t];
}

/* питч «как продать кандидату» — только из фактов в базе */
function pitchFor(c){
  const p=[]; const d=dj(c);
  if(c.marketRank&&c.marketRank<=10) p.push(`Входит в топ-${c.marketRank} фармпроизводителей России (Forbes 2025)`);
  if(c.hasRnD) p.push('Есть собственный R&D в России — реальные задачи разработки, а не только продажи');
  if((c.segments||[]).includes('Биотех')) p.push('Биотехнологическое производство — современный и востребованный стек');
  if(c.country==='Зарубеж') p.push('Международные стандарты и узнаваемый бренд в резюме');
  if(c.country==='СП') p.push('Российская производственная база под крылом международной группы');
  if(cities(c).length) p.push(`Собственное производство в РФ: ${cities(c).slice(0,3).join(', ')}`);
  if(typeof c.employeesRussia==='number'&&c.employeesRussia>=1500) p.push(`Большая команда: ${fmtNum(c.employeesRussia)} сотрудников в РФ`);
  if(c.revenue!=null&&c.revenue>=30) p.push(`Крупный масштаб: выручка в РФ ${c.revenue} млрд ₽`);
  if(d&&d.pct!=null&&d.pct>=78) p.push(`Высокая оценка сотрудников: ${d.pct}% рекомендуют (Dream Job)`);
  if(p.length<3){ if((c.therapeuticAreas||[]).length) p.push('Портфель в областях: '+c.therapeuticAreas.slice(0,3).join(', ')); p.push('Стабильный работодатель российского фармрынка'); }
  return p.slice(0,5);
}

/* зелёные/красные флаги — из реальных показателей Dream Job */
function flagsFor(c){
  const d=dj(c); const green=[],red=[];
  if(!d) return {green,red,has:false};

  if(d.m!=null&&d.m>=4.0) green.push('Сильное руководство'); if(d.m!=null&&d.m<3.4) red.push('Вопросы к руководству');
  if(d.c!=null&&d.c>=3.8) green.push('Хорошие перспективы роста'); if(d.c!=null&&d.c<3.0) red.push('Слабый карьерный рост');
  if(d.n!=null&&d.n<30) red.push('Мало отзывов — данные нерепрезентативны');
  return {green,red,has:green.length>0||red.length>0};
}

function djVerdict(d){
  let v;
  if (d.pct==null) return d.n!=null ? 'Кратко: отзывов мало для уверенного вывода.' : null;
  if (d.pct>=80) v='сотрудники в основном довольны — высокий рейтинг работодателя';
  else if (d.pct>=70) v='в целом положительные отзывы, но есть нюансы';
  else if (d.pct>=60) v='отзывы неоднозначные — стоит изучить детали';
  else v='преобладают сдержанные и критичные отзывы';
  if (d.n!=null && d.n<30) v+=' (мало отзывов — выборка нерепрезентативна)';
  return 'Кратко: '+v+'.';
}

function parseHash() {
  const h = (location.hash||'#/').replace(/^#/,'');
  const parts = h.split('/').filter(Boolean);
  if (parts[0]==='company' && parts[1]!=null) return { view:'company', id:Number(parts[1]) };

  return { view: known.includes(parts[0])?parts[0]:'catalog', id:null };
}

/* ============ CATALOG ============ */
function Catalog({ navigate, query, setQuery, filters, setFilters, layout, setLayout, expandedId, setExpandedId }) {
  const { country, prodOnly, rndOnly, region, segment, area, sort } = filters;
  const set = (k,v)=> setFilters({...filters,[k]:v});

  const filtered = useMemo(()=>{
    let list = DATA.filter(c=>{
      const hay = (c.name+' '+c.fullName+' '+c.keyProducts.join(' ')).toLowerCase();
      if (query && !hay.includes(query.toLowerCase())) return false;
      if (country!=='all' && c.country!==country) return false;
      if (prodOnly && !c.hasProductionInRussia) return false;
      if (rndOnly && !c.hasRnD) return false;
      if (region!=='all' && !c.regions.includes(region)) return false;
      if (segment!=='all' && !c.segments.includes(segment)) return false;
      if (area!=='all' && !c.therapeuticAreas.includes(area)) return false;
      return true;
    });
    const num = v => (typeof v==='number'?v:0);
    list.sort((a,b)=>{
      if (sort==='revenue') return (b.revenue??-1)-(a.revenue??-1);
      if (sort==='employees') return num(b.employeesRussia)-num(a.employeesRussia);
      if (sort==='factories') return cities(b).length-cities(a).length;
      if (sort==='rank') return (a.marketRank??999)-(b.marketRank??999);
      if (sort==='name') return a.name.localeCompare(b.name,'ru');
      return 0;
    });
    return list;
  },[query,country,prodOnly,rndOnly,region,segment,area,sort]);

  const exportCSV = ()=>{
    const head = ['Название','Полное название','Происхождение','Вид препаратов','R&D в РФ','Сотрудники РФ','Города производства','Регионы','Выручка РФ (млрд ₽)','Терапевт. области','Ключевые препараты','Сайт','Dream Job % рекоменд.','Dream Job отзывов'];

      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','); });
    const csv = '﻿'+[head.join(','),...rows].join('\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a = document.createElement('a'); a.href=url; a.download='pharma-companies.csv'; a.click(); URL.revokeObjectURL(url);
  };

  const exportXLS = ()=>{

    const compW=[160,250,95,55,160,60,190,95,95,190,190,115,210,270,210,75,75];

const GLOSSARY = [
  ['GMP','Good Manufacturing Practice — надлежащая производственная практика. Международный стандарт качества и безопасности производства лекарств. Сертификат GMP — обязательное условие для легального выпуска препаратов.'],
  ['Цикл разработки лекарства','Путь препарата: поиск мишени и молекулы → доклинические исследования (на клетках и животных) → клинические исследования фаз I–III на людях → регистрация и получение РУ → выпуск и пострегистрационный надзор (фаза IV). В среднем занимает 10–15 лет и миллиарды рублей; до рынка доходят единицы молекул из тысяч.'],
  ['Фазы клинических исследований','Фаза I — безопасность на небольшой группе (часто здоровые добровольцы); фаза II — эффективность и подбор доз на пациентах; фаза III — крупные сравнительные исследования перед регистрацией; фаза IV — наблюдение уже после выхода на рынок.'],
  ['Доклинические исследования','Изучение препарата в лаборатории и на животных до испытаний на людях: токсичность, фармакокинетика, безопасность. Обязательный этап перед клиническими исследованиями.'],
  ['Минздрав России','Министерство здравоохранения РФ — регистрирует лекарства (выдаёт регистрационное удостоверение), утверждает перечни (ЖНВЛП) и правила обращения лекарственных средств.'],
  ['Росздравнадзор','Федеральная служба по надзору в сфере здравоохранения — контроль качества лекарств на рынке, фармаконадзор, проверки производителей, изъятие недоброкачественных серий.'],
  ['НЦЭСМП','ФГБУ «Научный центр экспертизы средств медицинского применения» Минздрава — проводит экспертизу качества, эффективности и безопасности препаратов при их регистрации.'],
  ['FDA / EMA','Зарубежные регуляторы: FDA (США) и EMA (Евросоюз) выдают разрешения на лекарства на своих рынках и задают мировые стандарты. В ЕАЭС действует собственная процедура регистрации.'],
  ['Дженерик','Воспроизведённый аналог оригинального препарата с тем же действующим веществом, выпускаемый после истечения патента. Дешевле оригинала, биоэквивалентен ему.'],
  ['Оригинальный препарат','Лекарство, впервые разработанное и выведенное на рынок компанией-разработчиком; защищено патентом. Требует полного цикла клинических исследований.'],
  ['Биоаналог (биосимиляр)','Аналог биологического (например, белкового) препарата. В отличие от химического дженерика, не идентичен, а «подобен» оригиналу из-за сложности биопроизводства.'],
  ['R&D','Research & Development — исследования и разработки. Подразделения, создающие новые молекулы и препараты. Наличие R&D в РФ — признак компании полного цикла.'],
  ['Локализация','Перенос производства (полностью или частично — упаковка, готовая форма) на территорию России. Даёт доступ к госзакупкам и преференции по ЖНВЛП.'],
  ['Регистрационное удостоверение (РУ)','Документ Минздрава, разрешающий обращение конкретного препарата в РФ. Число РУ в портфеле — показатель широты ассортимента компании.'],
  ['ЖНВЛП','Жизненно необходимые и важнейшие лекарственные препараты — перечень, цены на который регулируются государством. Попадание в ЖНВЛП важно для госзакупок.'],
  ['АФИ / субстанция','Активный фармацевтический ингредиент — действующее вещество препарата. «Полный цикл» означает выпуск от субстанции до готовой формы.'],
  ['Готовая лекарственная форма (ГЛФ)','Финальный вид препарата для пациента: таблетка, ампула, капсула. «Локализация по ГЛФ» — финальные стадии производства в РФ.'],
  ['Биотех','Производство лекарств биологическими методами (живые клетки, белки, моноклональные антитела). Технологически сложнее химического синтеза.'],
  ['Моноклональные антитела','Биотехнологические белковые молекулы, прицельно связывающие мишень (например, опухолевые клетки). Основа современной онкологии и иммунологии.'],
  ['OTC / безрецептурные','Over-the-counter — препараты, отпускаемые без рецепта (от простуды, витамины, анальгетики). Продаются напрямую потребителю.'],
  ['Rx / рецептурные','Препараты, отпускаемые только по рецепту врача. Продвигаются через медицинских представителей, а не прямую рекламу.'],
  ['Пайплайн','Портфель препаратов компании на разных стадиях разработки и регистрации — показатель будущего роста.'],
  ['Фармаконадзор','Система мониторинга безопасности лекарств после выхода на рынок (сбор данных о побочных эффектах). Обязательна для каждого производителя.'],
  ['ЕАЭС (регистрация)','Единая процедура регистрации лекарств в Евразийском экономическом союзе — одно досье открывает доступ на рынки стран-участниц.'],
];
function Glossary() {
  const [q,setQ]=useState('');
  const list = GLOSSARY.filter(([t,d])=>(t+d).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Словарь терминов</h1>
      <p className="text-slate2 text-sm mt-1.5">«Фарма для новичка» — базовые понятия, цикл разработки лекарств и регуляторы</p>
      <div className="relative mt-4">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Найти термин…"
          className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-mint/40" />
        <svg className="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      </div>
      <div className="mt-5 space-y-2">
        {list.map(([t,d])=>(
          <details key={t} className="bg-white surf rounded-2xl p-4 group" open={!!q}>
            <summary className="font-display font-bold flex items-center justify-between">{t}<span className="text-mint text-xl group-open:rotate-45 transition">+</span></summary>
            <p className="text-sm text-slate2 mt-2.5 leading-relaxed">{d}</p>
          </details>
        ))}
        {list.length===0 && <p className="text-slate-400 text-center py-8">Термин не найден.</p>}
      </div>
    </div>
  );
}

/* ============ РЫНОК ТРУДА (зарплаты + дефицит) ============ */
function SalaryPage({ navigate }) {
  const [dir,setDir] = useState('all');
  const dirs = uniq(SALARY.map(s=>s.dir));
  const rows = SALARY.filter(s=>dir==='all'||s.dir===dir);
  const lvlTone = { 'Высокий':'rose','Средний':'amber','Низкий':'green' };
  return (
    <div className="max-w-6xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Рынок труда: зарплаты и дефицит</h1>
      <p className="text-slate2 text-sm mt-1.5 max-w-2xl">Ориентир по зарплатам (₽/мес, брутто) по ролям и регионам и карта «кадрового голода» — где сложно закрыть и где переплата за кандидата оправдана.</p>

      <div className="flex flex-wrap gap-2 mt-5">
        <button onClick={()=>setDir('all')} className={`px-3 py-1.5 rounded-full text-sm border transition ${dir==='all'?'bg-ink text-white border-ink':'bg-white border-slate-200 hover:border-mint'}`}>Все направления</button>
        {dirs.map(d=><button key={d} onClick={()=>setDir(d)} className={`px-3 py-1.5 rounded-full text-sm border transition ${dir===d?'bg-ink text-white border-ink':'bg-white border-slate-200 hover:border-mint'}`}>{d}</button>)}
      </div>

      <div className="mt-4 bg-white surf rounded-2xl overflow-x-auto">
        <table className="w-full text-sm min-w-[640px]">
          <thead><tr className="border-b border-slate-100 text-[11px] uppercase tracking-wider text-slate-400">
            <th className="text-left p-3.5">Роль</th><th className="text-left p-3.5">Направление</th>
            <th className="text-right p-3.5">Москва</th><th className="text-right p-3.5">Санкт-Петербург</th><th className="text-right p-3.5">Регионы</th>
          </tr></thead>
          <tbody>
            {rows.map((s,i)=>(
              <tr key={i} className={i%2?'bg-slate-50/40':''}>
                <td className="p-3.5 font-medium">{s.role}</td>
                <td className="p-3.5 text-slate2">{s.dir}</td>
                <td className="p-3.5 text-right whitespace-nowrap font-semibold">{rng(s.msk)} ₽</td>
                <td className="p-3.5 text-right whitespace-nowrap">{rng(s.spb)} ₽</td>
                <td className="p-3.5 text-right whitespace-nowrap">{rng(s.reg)} ₽</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">Диапазоны ориентировочные (медиана рынка, брутто), по публичным обзорам hh.ru и кадровых агентств 2025–2026. Реальная вилка зависит от грейда, бонусов и компании.</p>

      <h2 className="text-xl font-display font-extrabold mt-9">Карта дефицитных ролей</h2>
      <p className="text-slate2 text-sm mt-1">Где на рынке «голод» — закрывается долго, кандидаты в цене.</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
        {SCARCITY.map((s,i)=>(
          <div key={i} className="bg-white surf rounded-2xl p-4">
            <div className="flex items-center justify-between gap-2">
              <span className="font-display font-bold text-sm">{s.role}</span>
              <Tag tone={lvlTone[s.level]}>{s.level} дефицит</Tag>
            </div>
            <p className="text-sm text-slate2 mt-2">{s.why}</p>
            {s.overpay && <div className="mt-2 text-xs font-medium text-teal">💰 переплата за кандидата оправдана</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ АНАЛИТИКА РЫНКА (дашборд + тренды + сигналы) ============ */
function MarketPage({ navigate }) {
  const total=DATA.length;
  const ru=DATA.filter(c=>c.country==='РФ').length, foreign=DATA.filter(c=>c.country==='Зарубеж').length, sp=DATA.filter(c=>c.country==='СП').length;
  const withProd=DATA.filter(c=>c.hasProductionInRussia).length;
  const factories=DATA.flatMap(c=>c.factories).length;
  const topRev=DATA.filter(c=>c.revenue!=null).sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  const maxRev=topRev[0]?topRev[0].revenue:1;
  const segCounts=useMemo(()=>{const m={};DATA.forEach(c=>c.segments.forEach(s=>m[s]=(m[s]||0)+1));return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);},[]);
  const maxSeg=segCounts[0]?segCounts[0].value:1;
  const regionCounts=useMemo(()=>{const m={};DATA.forEach(c=>c.regions.forEach(r=>m[r]=(m[r]||0)+1));return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value).slice(0,8);},[]);
  const maxReg=regionCounts[0]?regionCounts[0].value:1;
  const newsTone={Финансы:'sky',Продукт:'mint',Производство:'amber',Рынок:'gray'};
  return (
    <div className="max-w-6xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Аналитика рынка</h1>
      <p className="text-slate2 text-sm mt-1.5 max-w-2xl">Контекст отрасли, которым удобно «продавать» компанию кандидату: масштаб, локализация, сегменты, тренды и кадровые сигналы.</p>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
        <StatCell value="≈1,89 трлн ₽" label="Розничный фармрынок РФ · 2025" />
        <StatCell value="47,3%" label="Доля отеч. лекарств (в ₽) · 2025" />
        <StatCell value={`${withProd} из ${total}`} label="С производством в РФ" />
        <StatCell value={factories} label="Производственных площадок" />
      </div>

      <div className="grid lg:grid-cols-2 gap-3 mt-3">
        <Block title="Топ-10 по выручке в РФ (млрд ₽)">
          <div className="space-y-2.5">{topRev.map(c=><Bar key={c.id} label={c.name} value={c.revenue} max={maxRev} onClick={()=>navigate('company',c.id)} />)}</div>
        </Block>
        <Block title="Происхождение компаний">
          <div className="space-y-2.5">
            <Bar label="Российские" value={ru} max={total} />
            <Bar label="Зарубежные" value={foreign} max={total} />
            <Bar label="Совместные (СП)" value={sp} max={total} />
          </div>
          <p className="text-xs text-slate2 mt-3">Локализация — ключевой тренд: {withProd} из {total} компаний имеют производство в РФ.</p>
        </Block>
      </div>

      <div className="grid lg:grid-cols-2 gap-3 mt-3">
        <Block title="Сегменты рынка (число компаний)">
          <div className="space-y-2.5">{segCounts.map(s=><Bar key={s.name} label={s.name} value={s.value} max={maxSeg} />)}</div>
        </Block>
        <Block title="Топ регионов по числу компаний">
          <div className="space-y-2.5">{regionCounts.map(r=><Bar key={r.name} label={r.name} value={r.value} max={maxReg} />)}</div>
        </Block>
      </div>

      <Block title="Тренды отрасли — «крючки» для кандидата" className="mt-3">
        <div className="grid sm:grid-cols-2 gap-3">
          {TRENDS.map((t,i)=>(
            <div key={i} className="border border-slate-100 rounded-xl p-3.5">
              <div className="font-display font-bold text-sm">{t.t}</div>
              <p className="text-sm text-slate2 mt-1">{t.d}</p>
              <p className="text-xs text-teal font-medium mt-1.5">{t.h}</p>
            </div>
          ))}
        </div>
      </Block>

      <Block title="Кадровые сигналы — события, влияющие на найм" className="mt-3">
        <div className="space-y-2.5">
          {NEWS.map((n,i)=>(
            <div key={i} className="flex items-start gap-3 border-b border-slate-100 last:border-0 pb-2.5 last:pb-0">
              <span className="text-xs font-semibold text-slate-400 w-10 shrink-0 mt-0.5">{n.year}</span>
              <div className="min-w-0 flex-1">
                <div className="text-sm"><span className="font-semibold">{n.company!=='—'?n.company+': ':''}</span>{n.t}</div>
                <div className="text-xs text-teal mt-0.5">{n.h}</div>
              </div>
              <Tag tone={newsTone[n.type]||'gray'}>{n.type}</Tag>
            </div>
          ))}
        </div>
        <p className="text-[11px] text-slate-400 mt-3">Источники: пресс-релизы компаний и отраслевые СМИ; влияние на найм — интерпретация, требует проверки.</p>
      </Block>
    </div>
  );
}

/* ============ ROOT ============ */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState({country:'all',prodOnly:false,rndOnly:false,region:'all',segment:'all',area:'all',sort:'revenue'});
  const [layout, setLayout] = useState('list');
  const [expandedId, setExpandedId] = useState(null);
  const [compareSel, setCompareSel] = useState(null);

  useEffect(()=>{
    const onHash = ()=>{ setRoute(parseHash()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);

  const navigate = useCallback((view, id, extra)=>{
    if (view==='compare' && extra!=null) setCompareSel(extra);
    location.hash = view==='company' && id!=null ? `#/company/${id}` : `#/${view}`;
  },[]);

  const { view, id } = route;
  const company = view==='company' ? DATA.find(c=>c.id===id) : null;

  return (
    <div className="min-h-screen flex flex-col">
      <Nav view={view} query={query} setQuery={setQuery} navigate={navigate} />
      <main className="flex-1">
        {view==='catalog' && <Catalog navigate={navigate} query={query} setQuery={setQuery} filters={filters} setFilters={setFilters} layout={layout} setLayout={setLayout} expandedId={expandedId} setExpandedId={setExpandedId} />}
        {view==='market' && <SalaryPage navigate={navigate} />}
        {view==='analytics' && <MarketPage navigate={navigate} />}
        {view==='compare' && <Compare navigate={navigate} selId={compareSel} setSelId={setCompareSel} />}
        {view==='glossary' && <Glossary />}
        {view==='biocad' && <BiocadPage navigate={navigate} />}
        {view==='company' && (company ? <CompanyPage c={company} navigate={navigate} /> :
          <div className="max-w-3xl mx-auto px-4 py-20 text-center text-slate2">Компания не найдена. <button onClick={()=>navigate('catalog')} className="text-teal underline">К каталогу</button></div>)}
      </main>
      <footer className="border-t border-slate-200 mt-12 py-7 no-print">
        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <span className="text-sm text-slate2"><b className="text-ink font-display">ФармаНавигатор</b> · справочник по фарм-отрасли России</span>
          <nav className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate2">
            {NAV.map(([k,l])=><button key={k} onClick={()=>navigate(k)} className="hover:text-teal">{l}</button>)}
          </nav>
        </div>
        <p className="max-w-7xl mx-auto px-4 mt-3 text-xs text-slate-400">100 компаний · данные в companies-data.js · отзывы — публичные агрегированные показатели Dream Job (dreamjob.ru), «н/д» = нет данных. Проект не аффилирован с упомянутыми компаниями. Сборка июнь 2026, требует проверки.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
