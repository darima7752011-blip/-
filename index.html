<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ФармаНавигатор — справочник по фарм-отрасли России</title>
<meta name="description" content="Справочник-навигатор по 100 крупнейшим фармацевтическим компаниям России: масштаб, города производств, виды препаратов, ключевые препараты, отзывы сотрудников и сравнение с Биокад." />

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

<!-- Данные 100 компаний — редактируются в companies-data.js -->
<script src="companies-data.js"></script>

<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display:['Manrope','system-ui','sans-serif'], body:['Inter','system-ui','sans-serif'] },
      colors: { ink:'#0f1f2e', slate2:'#64748b', mint:'#0fb5ba', teal:'#0e8f95', sky:'#1d9bf0', paper:'#f7f9fb' },
    }},
  };
</script>

<style>
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;background:#f7f9fb;color:#0f1f2e}
  h1,h2,h3,h4{font-family:'Manrope',sans-serif;letter-spacing:-.02em}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d7e0e6;border-radius:6px;border:3px solid #f7f9fb}
  ::-webkit-scrollbar-thumb:hover{background:#c2cfd7}
  .fade-in{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .expand{animation:exp .25s ease both}
  @keyframes exp{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}html{scroll-behavior:auto}}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  [tabindex]:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #0fb5ba;outline-offset:2px;border-radius:8px}
  @media print{header,footer,.no-print{display:none!important}body{background:#fff}}
  mark{background:#cdeff0;color:inherit;padding:0 1px;border-radius:3px}
</style>
</head>
<body>
<div id="root">
  <div style="max-width:640px;margin:90px auto;padding:0 24px;font-family:Manrope,system-ui;text-align:center;color:#0f1f2e">
    <div style="font-size:40px">💊</div>
    <h1 style="font-size:22px;font-weight:800;margin:10px 0 8px">ФармаНавигатор загружается…</h1>
    <p style="color:#64748b;font-size:14px;line-height:1.6">Если за 10–15 сек. ничего не появилось — обновите страницу (F5).</p>
  </div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback } = React;

const DATA = (window.PHARMA_COMPANIES || []).map((c, i) => ({ id: i, ...c }));
const BASE = DATA.find(c => c.name === 'Биокад') || DATA[0];

/* ============ helpers ============ */
const fmtRub = (v) => v == null ? "н/д" : v.toLocaleString('ru-RU') + " млрд ₽";
const fmtNum = (v) => (v === "н/д" || v == null) ? "н/д" : Number(v).toLocaleString('ru-RU');
const uniq = (a) => [...new Set(a)];
const cities = (c) => uniq((c.factories||[]).map(f=>f.city));
const ALL_SEGMENTS = uniq(DATA.flatMap(c => c.segments)).sort();
const ALL_REGIONS  = uniq(DATA.flatMap(c => c.regions)).sort((a,b)=>a.localeCompare(b,'ru'));
const ALL_AREAS    = uniq(DATA.flatMap(c => c.therapeuticAreas)).sort((a,b)=>a.localeCompare(b,'ru'));

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return <>{text.slice(0,i)}<mark>{text.slice(i,i+q.length)}</mark>{text.slice(i+q.length)}</>;
}

/* ============ отзывы сотрудников (обобщённые, выводятся из профиля) ============ */
const REVIEW_OVERRIDES = {
  'Биокад': { text:'Считается одной из лучших школ биотеха в России: реальные R&D-проекты, современное оборудование, международные амбиции. Сотрудники отмечают высокий темп и серьёзные требования, но и быстрый профессиональный рост.', pros:['Сильная наука и R&D','Карьерный рост','Современные лаборатории','Сильный бренд в резюме'], cons:['Высокая нагрузка и темп','Строгий отбор при найме'] },
  'Р-Фарм': { text:'Крупный системообразующий игрок с широким спектром функций — от производства до клинических исследований. Стабильность и масштаб, но процессы крупной корпорации.', pros:['Масштаб и стабильность','Разнообразие функций','Международные проекты'], cons:['Корпоративная бюрократия','Зарплаты средние по рынку'] },
  'ПромоМед': { text:'Динамичная компания с собственными разработками (метаболика, онкология). Отмечают интересные продукты и рост, но и высокую интенсивность.', pros:['Инновационный портфель','Рост и R&D','Молодая команда'], cons:['Высокая нагрузка','Процессы ещё формируются'] },
  'Герофарм': { text:'Сильна в биотехнологии инсулинов полного цикла. Хорошая школа для биотехнолога, стабильность и современное производство.', pros:['Полный цикл биотеха','Стабильность','Современное производство'], cons:['Узкая специализация','Локации (Оболенск/Пушкин)'] },
  'Биннофарм Групп': { text:'Большая группа (АФК «Система») с несколькими площадками. Стабильный работодатель с белым оформлением; масштаб даёт карьерные треки.', pros:['Масштаб группы','Стабильность','Белая зарплата'], cons:['Разрозненность площадок','Бюрократия'] },
  'Озон Фармацевтика': { text:'Лидер по дженерикам, публичная компания. Чёткие процессы производства и QC, ориентир на эффективность.', pros:['Лидер рынка','Стабильность','Прозрачность (публичная)'], cons:['Меньше оригинального R&D','Фокус на объёмах'] },
  'Генериум': { text:'Сильный биотех-центр полного цикла (орфанные, факторы свёртывания). Серьёзная наука, но удалённая локация (Вольгинский).', pros:['Глубокий R&D','Уникальные продукты'], cons:['Удалённая локация','Узкий рынок труда рядом'] },
};
function reviewFor(c){
  if (REVIEW_OVERRIDES[c.name]) return REVIEW_OVERRIDES[c.name];
  if (c.country==='Зарубеж') return {
    text:'Международная школа: сильные стандарты, обучение, комплаенс и узнаваемый бренд в резюме. После 2022 многие глобальные компании сократили инвестиции и штат в РФ — меньше вакансий и больше неопределённости.',
    pros:['Международные стандарты','Обучение и soft skills','Бренд в резюме'],
    cons:['Сокращение присутствия в РФ','Почти нет локального R&D/производства','Неопределённость планов'] };
  if (c.country==='СП') return {
    text:'Локальное производство под крылом международной группы: стабильные процессы и узнаваемый бренд при российской производственной базе.',
    pros:['Стабильность','Международные стандарты на производстве','Сильный бренд'],
    cons:['Ограниченный R&D','Зависимость от головной компании'] };
  const bio = c.segments.some(s=>['Биотех','Оригинальные','Вакцины'].includes(s));
  const gov = /государ|госкорп|ниц|фгуп|фгбу/i.test((c.status||'')+(c.fullName||''));
  if (gov) return {
    text:'Государственная/научная структура: высокая стабильность и серьёзная научная база, но бюрократия и более медленные процессы.',
    pros:['Высокая стабильность','Научная среда','Социальные гарантии'],
    cons:['Бюрократия','Медленные процессы','Зарплаты ниже частного сектора'] };
  if (c.hasRnD && bio) return {
    text:'Российский производитель с реальными R&D-задачами и современным производством. Хорошая школа: интересные проекты при высокой нагрузке и серьёзных требованиях при найме.',
    pros:['Реальный R&D','Карьерный рост','Современное оборудование'],
    cons:['Высокая нагрузка','Высокие требования при найме'] };
  if (c.hasRnD) return {
    text:'Развивающаяся компания с производством и собственными разработками; белое оформление и фокус на качестве.',
    pros:['Стабильность','Есть R&D-функции','Белая зарплата'],
    cons:['Бюрократия','Зарплаты средние по рынку'] };
  return {
    text:'Производственный работодатель: стабильная занятость, понятные процессы, фокус на выпуске и контроле качества. Меньше науки и продуктовых инноваций.',
    pros:['Стабильная занятость','Понятные процессы','Белое оформление'],
    cons:['Мало R&D-вакансий','Рутинные задачи','Ограниченный карьерный потолок'] };
}
function compatWithBase(c){
  if (c.id===BASE.id) return null;
  let s=0;
  if (c.hasRnD) s+=2;
  if (c.segments.includes('Биотех')) s+=2;
  if (c.segments.includes('Оригинальные')) s+=1;
  if (c.segments.includes('Вакцины')) s+=1;
  const keys=['Онколог','Иммун','Аутоиммун','Инфекци','Гематолог'];
  if (c.therapeuticAreas.some(a=>keys.some(k=>a.includes(k)))) s+=1;
  if (s>=4) return { level:'Высокая', tone:'green', text:'Кандидат из этой компании по профилю близок к Биокаду: схожий биотех/R&D-бэкграунд. Можно смело рассматривать.' };
  if (s>=2) return { level:'Средняя', tone:'amber', text:'Частичное совпадение профиля с Биокадом. Кандидата стоит рассмотреть, но проверьте опыт в биотехе/R&D и релевантных терапевтических областях.' };
  return { level:'Низкая', tone:'rose', text:'Профиль заметно отличается от Биокада (мало биотеха/R&D). Кандидат может требовать переобучения под задачи Биокада.' };
}

/* ============ tiny atoms ============ */
function Tag({ children, tone='gray', onClick, title }) {
  const tones = { mint:'bg-mint/10 text-teal', sky:'bg-sky/10 text-sky-700', gray:'bg-slate-100 text-slate-600',
    green:'bg-emerald-50 text-emerald-700', amber:'bg-amber-50 text-amber-700', rose:'bg-rose-50 text-rose-600', ink:'bg-ink text-white' };
  const Cmp = onClick ? 'button' : 'span';
  return <Cmp onClick={onClick} title={title} className={`inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full ${tones[tone]} ${onClick?'hover:opacity-80 transition':''}`}>{children}</Cmp>;
}
function CountryBadge({ country }) {
  const map = { 'РФ':['green','Российская'], 'Зарубеж':['sky','Зарубежная'], 'СП':['amber','Совместная'] };
  const [tone,label] = map[country] || ['gray', country];
  return <Tag tone={tone}>{label}</Tag>;
}
function RankBadge({ rank }) {
  if (!rank) return null;
  return <span title="Позиция в рейтинге Forbes по итогам 2025 г."
    className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full ${rank<=3?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate-500'}`}>
    {rank<=3?'★':'#'}{rank}<span className="font-medium opacity-60">Forbes</span></span>;
}
function StatCell({ value, label }) {
  return <div className="bg-white border border-slate-200 rounded-xl px-4 py-3">
    <div className="text-xl font-display font-extrabold leading-tight">{value}</div>
    <div className="text-xs text-slate2 mt-0.5">{label}</div>
  </div>;
}
function Block({ title, children, className }) {
  return <section className={`bg-white border border-slate-200 rounded-xl p-4 ${className||''}`}>
    <h4 className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2.5">{title}</h4>
    {children}
  </section>;
}

/* ============ routing ============ */
function parseHash() {
  const h = (location.hash||'#/').replace(/^#/,'');
  const parts = h.split('/').filter(Boolean);
  if (parts[0]==='company' && parts[1]!=null) return { view:'company', id:Number(parts[1]) };
  const known = ['catalog','compare','glossary','about'];
  return { view: known.includes(parts[0])?parts[0]:'catalog', id:null };
}

/* ============ NAV ============ */
const NAV = [['catalog','Каталог'],['compare','Сравнение'],['glossary','Словарь'],['about','О проекте']];
function Nav({ view, query, setQuery, navigate }) {
  const [open, setOpen] = useState(false);
  const active = view==='company' ? 'catalog' : view;
  return (
    <header className="sticky top-0 z-[1000] bg-white/90 backdrop-blur-md border-b border-slate-200 no-print">
      <div className="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
        <button onClick={()=>navigate('catalog')} className="flex items-center gap-2 shrink-0">
          <div className="w-8 h-8 rounded-lg bg-teal flex items-center justify-center text-white font-display font-extrabold text-sm">Ф</div>
          <span className="font-display font-extrabold text-lg hidden sm:block">ФармаНавигатор</span>
        </button>
        <nav className="hidden md:flex items-center gap-0.5 ml-2">
          {NAV.map(([k,l]) => (
            <button key={k} onClick={()=>navigate(k)} aria-current={active===k?'page':undefined}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${active===k?'bg-mint/10 text-teal':'text-slate2 hover:text-ink hover:bg-slate-50'}`}>{l}</button>
          ))}
        </nav>
        <div className="flex-1" />
        <div className="relative hidden sm:block">
          <input value={query} onChange={e=>{setQuery(e.target.value); if(e.target.value && active!=='catalog') navigate('catalog');}}
            placeholder="Поиск компании…" aria-label="Поиск компании"
            className="w-44 lg:w-64 pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-mint/40 focus:border-mint" />
          <svg className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        </div>
        <button onClick={()=>setOpen(!open)} className="md:hidden p-2 rounded-lg hover:bg-slate-50" aria-label="Меню" aria-expanded={open}>
          <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d={open?"M6 6l12 12M6 18L18 6":"M4 6h16M4 12h16M4 18h16"}/></svg>
        </button>
      </div>
      {open && (
        <div className="md:hidden border-t border-slate-200 px-4 py-3 grid grid-cols-2 gap-2 bg-white">
          {NAV.map(([k,l]) => (
            <button key={k} onClick={()=>{navigate(k); setOpen(false);}}
              className={`px-3 py-2 rounded-lg text-sm font-medium text-left ${active===k?'bg-mint/10 text-teal':'text-slate2 hover:bg-slate-50'}`}>{l}</button>
          ))}
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск…" aria-label="Поиск"
            className="col-span-2 mt-1 px-3 py-2 rounded-lg border border-slate-200 text-sm" />
        </div>
      )}
    </header>
  );
}

/* ============ COMPANY DETAIL (компактно, разворачивается на месте) ============ */
function CompanyDetail({ c, showHeader, navigate }) {
  const cityList = cities(c);
  const rev = reviewFor(c);
  const gmpCount = (c.factories||[]).filter(f=>f.gmp==='Да').length;
  const facts = [
    ['Происхождение', {'РФ':'Российская','Зарубеж':'Зарубежная','СП':'Совместная'}[c.country]||c.country],
    ['На рынке РФ с', c.yearEnteredRussia],
    ['Заводов в РФ', (c.factories||[]).length||'—'],
    ['Площадок с GMP', gmpCount||'—'],
    ['Регионов', c.regions.length],
    ['Сегментов', c.segments.length],
    ['Терапевт. областей', c.therapeuticAreas.length],
    ['R&D в России', c.hasRnD?'Да':'Нет'],
  ];
  return (
    <div className="expand">
      {showHeader && (
        <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
          <div className="min-w-0">
            <div className="text-slate2 text-sm">{c.fullName}</div>
            <div className="mt-1.5 flex flex-wrap gap-1.5">
              <CountryBadge country={c.country} />
              <Tag tone="gray">{c.status}</Tag>
              {c.hasProductionInRussia && <Tag tone="green">Производство в РФ</Tag>}
              {c.hasRnD && <Tag tone="sky">R&D в РФ</Tag>}
            </div>
          </div>
          {c.website && <a href={c.website} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg bg-ink text-white text-xs font-medium hover:opacity-90 no-print shrink-0">Сайт ↗</a>}
        </div>
      )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-4">
        <StatCell value={fmtRub(c.revenue)} label={`Выручка в РФ · ${c.revenueYear}`} />
        <StatCell value={fmtNum(c.employeesRussia)} label="Сотрудники в РФ" />
        <StatCell value={fmtNum(c.employeesGlobal)} label="Сотрудники глобально" />
        <StatCell value={cityList.length||'—'} label="Городов производства" />
      </div>

      <div className="grid lg:grid-cols-3 gap-3">
        <Block title="Ключевые препараты">
          {c.keyProducts.length ? (
            <ul className="space-y-1.5">
              {c.keyProducts.map((p,i)=><li key={i} className="flex gap-2 text-sm"><span className="text-mint">▪</span><span>{p}</span></li>)}
            </ul>
          ) : <div className="text-sm text-slate-400">нет данных</div>}
          <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mt-3 mb-1.5">Терапевтические области</div>
          <div className="flex flex-wrap gap-1.5">{c.therapeuticAreas.map(a=><Tag key={a} tone="mint">{a}</Tag>)}</div>
        </Block>

        <Block title="Профиль">
          <div className="text-[11px] text-slate-400 mb-1">Вид препаратов</div>
          <div className="flex flex-wrap gap-1.5 mb-3">{c.segments.map(s=><Tag key={s} tone="gray">{s}</Tag>)}</div>
          <div className="text-[11px] text-slate-400 mb-1">Регионы присутствия</div>
          <div className="flex flex-wrap gap-1.5">{c.regions.map(r=><Tag key={r} tone="amber">{r}</Tag>)}</div>
        </Block>

        <Block title={`Производство · ${cityList.length} ${cityList.length===1?'город':'городов'}`}>
          {cityList.length ? (
            <>
              <div className="flex flex-wrap gap-1.5">{cityList.map(ct=><Tag key={ct} tone="gray">📍 {ct}</Tag>)}</div>
              {(c.factories||[]).length>0 && (
                <details className="mt-3 group">
                  <summary className="text-xs font-medium text-teal hover:underline">Подробнее о площадках ▾</summary>
                  <div className="mt-2 space-y-2">
                    {c.factories.map((f,i)=>(
                      <div key={i} className="border border-slate-100 rounded-lg p-2.5">
                        <div className="text-sm font-semibold flex items-center justify-between gap-2"><span>{f.city}</span><Tag tone={f.gmp==='Да'?'green':'gray'}>GMP: {f.gmp}</Tag></div>
                        <div className="text-xs text-slate2 mt-0.5">{f.products}</div>
                      </div>
                    ))}
                  </div>
                </details>
              )}
            </>
          ) : <div className="text-sm text-slate-400">Нет собственного производства в РФ — присутствие / импорт.</div>}
        </Block>

        <Block title="Что говорят сотрудники" className="lg:col-span-2">
          <p className="text-sm text-slate2 leading-relaxed">{rev.text}</p>
          <div className="grid sm:grid-cols-2 gap-3 mt-3">
            <div>
              <div className="text-[11px] font-semibold uppercase tracking-wider text-emerald-600 mb-1.5">Плюсы</div>
              <ul className="space-y-1">{rev.pros.map((p,i)=><li key={i} className="text-sm flex gap-1.5"><span className="text-emerald-500">+</span>{p}</li>)}</ul>
            </div>
            <div>
              <div className="text-[11px] font-semibold uppercase tracking-wider text-rose-500 mb-1.5">Минусы</div>
              <ul className="space-y-1">{rev.cons.map((p,i)=><li key={i} className="text-sm flex gap-1.5"><span className="text-rose-400">−</span>{p}</li>)}</ul>
            </div>
          </div>
          <p className="text-[11px] text-slate-400 mt-2.5">Обобщённое мнение о типе работодателя, а не верифицированный отзыв конкретных сотрудников.</p>
        </Block>

        <Block title="Факты о компании">
          <dl className="grid grid-cols-2 gap-x-3 gap-y-2.5">
            {facts.map(([l,v],i)=>(<div key={i} className="min-w-0"><dt className="text-[11px] text-slate-400">{l}</dt><dd className="font-semibold text-sm mt-0.5 truncate">{v}</dd></div>))}
          </dl>
        </Block>
      </div>

      {c.note && (
        <details className="mt-3 bg-white border border-slate-200 rounded-xl p-4 group">
          <summary className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between">Ключевые события<span className="text-mint text-base group-open:rotate-45 transition">+</span></summary>
          <p className="text-sm text-slate2 mt-2.5">{c.note}</p>
        </details>
      )}

      {navigate && (
        <div className="mt-3 no-print">
          <button onClick={()=>navigate('compare',null,c.id)} className="text-sm text-teal font-medium hover:underline">Сравнить с Биокад →</button>
        </div>
      )}
    </div>
  );
}

/* ============ FILTERS SIDEBAR ============ */
function Filters({ filters, setFilters, query, setQuery, count }) {
  const { country, prodOnly, rndOnly, region, segment, area } = filters;
  const set = (k,v)=> setFilters({...filters,[k]:v});
  const reset = ()=>{ setFilters({...filters,country:'all',prodOnly:false,rndOnly:false,region:'all',segment:'all',area:'all'}); setQuery(''); };
  const dirty = country!=='all'||region!=='all'||segment!=='all'||area!=='all'||prodOnly||rndOnly||query;
  const Sel = ({value,onChange,children,label}) => (
    <label className="block">
      <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)}
        className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-mint/40">{children}</select>
    </label>
  );
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display font-bold">Фильтры</h2>
        {dirty && <button onClick={reset} className="text-xs text-slate-400 hover:text-ink underline">сбросить</button>}
      </div>
      <Sel value={country} onChange={v=>set('country',v)} label="Происхождение">
        <option value="all">Все</option><option value="РФ">Российские</option><option value="Зарубеж">Зарубежные</option><option value="СП">Совместные</option>
      </Sel>
      <Sel value={segment} onChange={v=>set('segment',v)} label="Вид препаратов">
        <option value="all">Все виды</option>{ALL_SEGMENTS.map(s=><option key={s} value={s}>{s}</option>)}
      </Sel>
      <Sel value={area} onChange={v=>set('area',v)} label="Терапевт. область">
        <option value="all">Все области</option>{ALL_AREAS.map(a=><option key={a} value={a}>{a}</option>)}
      </Sel>
      <Sel value={region} onChange={v=>set('region',v)} label="Регион">
        <option value="all">Все регионы</option>{ALL_REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
      </Sel>
      <div className="space-y-2 pt-1">
        <label className="flex items-center gap-2"><input type="checkbox" checked={prodOnly} onChange={e=>set('prodOnly',e.target.checked)} className="w-4 h-4 accent-mint" /><span className="text-sm">Завод в РФ</span></label>
        <label className="flex items-center gap-2"><input type="checkbox" checked={rndOnly} onChange={e=>set('rndOnly',e.target.checked)} className="w-4 h-4 accent-mint" /><span className="text-sm">R&D в РФ</span></label>
      </div>
      <div className="text-xs text-slate-400 pt-1 border-t border-slate-100">Найдено: <b className="text-ink">{count}</b> из {DATA.length}</div>
    </div>
  );
}

/* ============ CATALOG ============ */
function Catalog({ navigate, query, setQuery, filters, setFilters, layout, setLayout, expandedId, setExpandedId }) {
  const { country, prodOnly, rndOnly, region, segment, area, sort } = filters;
  const set = (k,v)=> setFilters({...filters,[k]:v});
  const [showFilters, setShowFilters] = useState(false);

  const filtered = useMemo(()=>{
    let list = DATA.filter(c=>{
      const hay = (c.name+' '+c.fullName+' '+c.keyProducts.join(' ')).toLowerCase();
      if (query && !hay.includes(query.toLowerCase())) return false;
      if (country!=='all' && c.country!==country) return false;
      if (prodOnly && !c.hasProductionInRussia) return false;
      if (rndOnly && !c.hasRnD) return false;
      if (region!=='all' && !c.regions.includes(region)) return false;
      if (segment!=='all' && !c.segments.includes(segment)) return false;
      if (area!=='all' && !c.therapeuticAreas.includes(area)) return false;
      return true;
    });
    const num = v => (typeof v==='number'?v:0);
    list.sort((a,b)=>{
      if (sort==='revenue') return (b.revenue??-1)-(a.revenue??-1);
      if (sort==='employees') return num(b.employeesRussia)-num(a.employeesRussia);
      if (sort==='factories') return cities(b).length-cities(a).length;
      if (sort==='rank') return (a.marketRank??999)-(b.marketRank??999);
      if (sort==='name') return a.name.localeCompare(b.name,'ru');
      return 0;
    });
    return list;
  },[query,country,prodOnly,rndOnly,region,segment,area,sort]);

  const exportCSV = ()=>{
    const head = ['Название','Полное название','Происхождение','Вид препаратов','Города производства','Регионы','Выручка РФ (млрд ₽)','Сотрудники РФ','Терапевт. области','Ключевые препараты','R&D в РФ','Сайт'];
    const rows = filtered.map(c=>[c.name,c.fullName,c.country,c.segments.join('; '),cities(c).join('; '),c.regions.join('; '),c.revenue??'',c.employeesRussia,c.therapeuticAreas.join('; '),c.keyProducts.join('; '),c.hasRnD?'Да':'Нет',c.website||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = '﻿'+[head.join(','),...rows].join('\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a = document.createElement('a'); a.href=url; a.download='pharma-companies.csv'; a.click(); URL.revokeObjectURL(url);
  };

  const toggle = (id)=> setExpandedId(expandedId===id?null:id);

  return (
    <div className="max-w-7xl mx-auto px-4 py-6 fade-in">
      <div className="mb-6">
        <h1 className="text-2xl md:text-3xl font-display font-extrabold">Справочник фарм-компаний России</h1>
        <p className="text-slate2 mt-1.5 max-w-2xl text-sm">100 крупнейших игроков отрасли. Фильтры — слева, клик по компании раскрывает подробную карточку прямо в списке.</p>
      </div>

      <div className="lg:grid lg:grid-cols-[250px_1fr] lg:gap-6 items-start">
        <aside className="lg:sticky lg:top-20">
          <button onClick={()=>setShowFilters(!showFilters)} className="lg:hidden w-full mb-3 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-medium flex items-center justify-between">
            Фильтры <span className="text-slate-400">{showFilters?'▲':'▼'}</span>
          </button>
          <div className={`${showFilters?'block':'hidden'} lg:block bg-white border border-slate-200 rounded-xl p-4 mb-4 lg:mb-0`}>
            <Filters filters={filters} setFilters={setFilters} query={query} setQuery={setQuery} count={filtered.length} />
          </div>
        </aside>

        <div>
          <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
            <p className="text-slate2 text-sm"><span className="font-bold text-ink">{filtered.length}</span> компаний</p>
            <div className="flex gap-2 items-center">
              <div className="flex items-center rounded-lg border border-slate-200 p-0.5 bg-white" role="group" aria-label="Вид">
                <button onClick={()=>setLayout('list')} aria-pressed={layout==='list'} title="Списком" className={`p-1.5 rounded-md transition ${layout==='list'?'bg-mint/10 text-teal':'text-slate-400 hover:text-ink'}`}>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                </button>
                <button onClick={()=>setLayout('grid')} aria-pressed={layout==='grid'} title="Плиткой" className={`p-1.5 rounded-md transition ${layout==='grid'?'bg-mint/10 text-teal':'text-slate-400 hover:text-ink'}`}>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
              </div>
              <button onClick={exportCSV} className="px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm font-medium hover:border-mint flex items-center gap-1.5" title="Скачать CSV">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>CSV
              </button>
              <label className="flex items-center gap-1.5 text-sm">
                <span className="text-slate-400 hidden sm:inline">Сорт.</span>
                <select value={sort} onChange={e=>set('sort',e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white">
                  <option value="revenue">По выручке</option><option value="rank">По Forbes</option><option value="employees">По сотрудникам</option><option value="factories">По числу городов</option><option value="name">По названию</option>
                </select>
              </label>
            </div>
          </div>

          {filtered.length===0 ? (
            <div className="bg-white border border-slate-200 rounded-xl p-12 text-center">
              <p className="text-slate2 font-medium">Ничего не нашлось</p>
              <p className="text-sm text-slate-400 mt-1">Смягчите фильтры или измените запрос.</p>
            </div>
          ) : layout==='grid' ? (
            <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
              {filtered.map(c=>(
                <button key={c.id} onClick={()=>navigate('company',c.id)} className="text-left bg-white border border-slate-200 rounded-xl p-4 hover:border-mint/50 hover:shadow-sm transition group">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-display font-bold group-hover:text-teal transition">{highlight(c.name,query)}</span>
                    {c.marketRank && <RankBadge rank={c.marketRank} />}
                  </div>
                  <div className="mt-1.5"><CountryBadge country={c.country} /></div>
                  <div className="mt-3 text-sm font-semibold">{fmtRub(c.revenue)}</div>
                  <div className="text-xs text-slate-400">выручка в РФ</div>
                  <div className="mt-3 flex flex-wrap gap-1.5">{c.segments.slice(0,3).map(s=><Tag key={s} tone="gray">{s}</Tag>)}{c.segments.length>3 && <Tag tone="gray">+{c.segments.length-3}</Tag>}</div>
                </button>
              ))}
            </div>
          ) : (
            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
              <div className="hidden md:grid grid-cols-[1fr_16rem_8.5rem_2rem] gap-4 px-4 py-2.5 text-[11px] font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-200 bg-slate-50/70">
                <div>Компания</div><div>Вид препаратов</div><div className="text-right">Выручка в РФ</div><div></div>
              </div>
              {filtered.map(c=>{
                const open = expandedId===c.id;
                return (
                  <div key={c.id} className="border-b border-slate-100 last:border-0">
                    <button onClick={()=>toggle(c.id)} aria-expanded={open}
                      className={`text-left w-full px-4 py-3.5 grid grid-cols-1 md:grid-cols-[1fr_16rem_8.5rem_2rem] gap-2 md:gap-4 md:items-center group transition ${open?'bg-mint/5':'hover:bg-slate-50'}`}>
                      <div className="flex items-center gap-2 flex-wrap min-w-0">
                        <span className="font-display font-bold text-ink group-hover:text-teal transition">{highlight(c.name,query)}</span>
                        <CountryBadge country={c.country} />
                        {c.marketRank && <RankBadge rank={c.marketRank} />}
                      </div>
                      <div className="flex flex-wrap gap-1.5 content-center">{c.segments.map(s=><Tag key={s} tone="gray">{s}</Tag>)}</div>
                      <div className="md:text-right"><div className="text-sm font-bold text-ink">{fmtRub(c.revenue)}</div><div className="text-xs text-slate-400">{fmtNum(c.employeesRussia)} чел. в РФ</div></div>
                      <svg className={`hidden md:block w-4 h-4 shrink-0 transition ${open?'rotate-90 text-teal':'text-slate-300 group-hover:text-teal'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                    {open && (
                      <div className="px-4 pb-5 pt-1 bg-slate-50/40 border-t border-slate-100">
                        <CompanyDetail c={c} showHeader navigate={navigate} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ COMPANY PAGE (route) ============ */
function CompanyPage({ c, navigate }) {
  const idx = DATA.findIndex(x=>x.id===c.id);
  const prev = DATA[(idx-1+DATA.length)%DATA.length], next = DATA[(idx+1)%DATA.length];
  return (
    <div className="max-w-6xl mx-auto px-4 py-6 fade-in">
      <div className="flex items-center justify-between mb-4 no-print">
        <button onClick={()=>navigate('catalog')} className="text-sm text-slate2 hover:text-ink">← К каталогу</button>
        <div className="flex items-center gap-1">
          <button onClick={()=>window.print()} className="px-3 py-1.5 rounded-lg text-sm text-slate2 hover:bg-white">🖨 Печать</button>
          <button onClick={()=>navigate('company',prev.id)} className="px-3 py-1.5 rounded-lg text-sm text-slate2 hover:bg-white">← Пред.</button>
          <button onClick={()=>navigate('company',next.id)} className="px-3 py-1.5 rounded-lg text-sm text-slate2 hover:bg-white">След. →</button>
        </div>
      </div>
      <div className="bg-white border border-slate-200 rounded-xl p-5 relative overflow-hidden mb-4">

        <div className="flex items-center gap-2 flex-wrap">
          <h1 className="text-2xl md:text-3xl font-display font-extrabold">{c.name}</h1>
          {c.marketRank && <RankBadge rank={c.marketRank} />}
        </div>
      </div>
      <CompanyDetail c={c} showHeader navigate={navigate} />
    </div>
  );
}

/* ============ COMPARE (на базе Биокад) ============ */
function Compare({ navigate, selId, setSelId }) {
  const [q,setQ]=useState('');
  const sel = DATA.find(c=>c.id===selId) || null;
  const opts = DATA.filter(c=>c.id!==BASE.id && c.name.toLowerCase().includes(q.toLowerCase()));
  const compat = sel ? compatWithBase(sel) : null;
  const rows = [
    ['Происхождение', c=>({'РФ':'Российская','Зарубеж':'Зарубежная','СП':'Совместная'}[c.country]||c.country)],
    ['Вид препаратов', c=>c.segments.join(', ')],
    ['Терапевт. области', c=>c.therapeuticAreas.join(', ')],
    ['R&D в России', c=>c.hasRnD?'Да':'Нет'],
    ['Производство в РФ', c=>c.hasProductionInRussia?'Да':'Нет'],
    ['Города производства', c=>cities(c).join(', ')||'н/д'],
    ['Выручка в РФ, млрд ₽', c=>c.revenue==null?'н/д':c.revenue.toLocaleString('ru-RU')],
    ['Сотрудники в РФ', c=>fmtNum(c.employeesRussia)],
    ['Ключевые препараты', c=>c.keyProducts.join(', ')],
  ];
  const Col = ({c, head}) => (
    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div className="p-4 border-b border-slate-100" style={{boxShadow:`inset 0 3px 0 ${c.logoColor||'#0fb5ba'}`}}>
        <div className="flex items-center gap-2 flex-wrap">
          <span className="font-display font-extrabold text-lg">{c.name}</span>
          {head && <Tag tone="mint">эталон</Tag>}
          {c.marketRank && <RankBadge rank={c.marketRank} />}
        </div>
        <div className="text-xs text-slate2 mt-1">{c.fullName}</div>
      </div>
      <div className="p-4">
        <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Что говорят сотрудники</div>
        <p className="text-sm text-slate2 leading-relaxed">{reviewFor(c).text}</p>
        <button onClick={()=>navigate('company',c.id)} className="text-sm text-teal font-medium hover:underline mt-3 no-print">Полная карточка →</button>
      </div>
    </div>
  );

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Сравнение с Биокад</h1>
      <p className="text-slate2 text-sm mt-1.5 max-w-2xl">Биокад — эталон современного биотеха полного цикла. Выберите компанию, чтобы понять, насколько кандидат с таким опытом подойдёт под профиль Биокада.</p>

      <div className="relative mt-5 max-w-md">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Выберите или найдите компанию…"
          className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-mint/40" />
        <svg className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      </div>
      {q && (
        <div className="mt-2 max-w-md bg-white border border-slate-200 rounded-xl max-h-60 overflow-y-auto">
          {opts.slice(0,40).map(c=>(
            <button key={c.id} onClick={()=>{setSelId(c.id); setQ('');}} className="w-full text-left px-4 py-2 text-sm hover:bg-mint/5 border-b border-slate-100 last:border-0">{c.name}</button>
          ))}
          {opts.length===0 && <div className="px-4 py-3 text-sm text-slate-400">не найдено</div>}
        </div>
      )}
      {!q && (
        <div className="mt-3 flex flex-wrap gap-2">
          {DATA.filter(c=>c.id!==BASE.id && c.marketRank).sort((a,b)=>a.marketRank-b.marketRank).slice(0,8).map(c=>(
            <button key={c.id} onClick={()=>setSelId(c.id)} className={`px-3 py-1.5 rounded-full text-sm border transition ${selId===c.id?'bg-ink text-white border-ink':'bg-white border-slate-200 hover:border-mint'}`}>{c.name}</button>
          ))}
        </div>
      )}

      {sel ? (
        <>
          <div className={`mt-6 rounded-xl p-4 border ${compat.tone==='green'?'bg-emerald-50 border-emerald-200':compat.tone==='amber'?'bg-amber-50 border-amber-200':'bg-rose-50 border-rose-200'}`}>
            <div className="flex items-center gap-2">
              <span className={`text-sm font-bold ${compat.tone==='green'?'text-emerald-700':compat.tone==='amber'?'text-amber-700':'text-rose-700'}`}>Совместимость с Биокад: {compat.level}</span>
            </div>
            <p className="text-sm text-slate2 mt-1.5">{compat.text}</p>
          </div>

          <div className="grid md:grid-cols-2 gap-3 mt-4">
            <Col c={BASE} head />
            <Col c={sel} />
          </div>

          <div className="mt-4 overflow-x-auto bg-white border border-slate-200 rounded-xl">
            <table className="w-full text-sm min-w-[560px]">
              <thead><tr className="border-b border-slate-100">
                <th className="text-left p-3.5 text-slate-400 font-medium w-44">Параметр</th>
                <th className="text-left p-3.5 font-display font-bold">{BASE.name}</th>
                <th className="text-left p-3.5 font-display font-bold">{sel.name}</th>
              </tr></thead>
              <tbody>
                {rows.map(([label,fn],i)=>(
                  <tr key={i} className={i%2?'bg-slate-50/50':''}>
                    <td className="p-3.5 text-slate-400 align-top">{label}</td>
                    <td className="p-3.5 align-top">{fn(BASE)}</td>
                    <td className="p-3.5 align-top">{fn(sel)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-[11px] text-slate-400 mt-2">Отзывы — обобщённое представление о типе работодателя, не верифицированные мнения конкретных сотрудников.</p>
        </>
      ) : (
        <div className="mt-6 bg-white border border-slate-200 rounded-xl p-12 text-center text-slate2">
          Выберите компанию выше, чтобы сравнить её с Биокад.
        </div>
      )}
    </div>
  );
}

  ['GMP','Good Manufacturing Practice — надлежащая производственная практика. Международный стандарт качества и безопасности производства лекарств. Сертификат GMP — обязательное условие для легального выпуска препаратов.'],
  ['Дженерик','Воспроизведённый аналог оригинального препарата с тем же действующим веществом, выпускаемый после истечения патента. Дешевле оригинала, биоэквивалентен ему.'],
  ['Оригинальный препарат','Лекарство, впервые разработанное и выведенное на рынок компанией-разработчиком; защищено патентом. Требует полного цикла клинических исследований.'],
  ['Биоаналог (биосимиляр)','Аналог биологического (например, белкового) препарата. В отличие от химического дженерика, не идентичен, а «подобен» оригиналу из-за сложности биопроизводства.'],
  ['R&D','Research & Development — исследования и разработки. Подразделения, создающие новые молекулы и препараты. Наличие R&D в РФ — признак компании полного цикла.'],
  ['Локализация','Перенос производства (полностью или частично — упаковка, готовая форма) на территорию России. Даёт доступ к госзакупкам и преференции по ЖНВЛП.'],
  ['Регистрационное удостоверение (РУ)','Документ Минздрава, разрешающий обращение конкретного препарата в РФ. Число РУ в портфеле — показатель широты ассортимента компании.'],
  ['ЖНВЛП','Жизненно необходимые и важнейшие лекарственные препараты — перечень, цены на который регулируются государством. Попадание в ЖНВЛП важно для госзакупок.'],
  ['АФИ / субстанция','Активный фармацевтический ингредиент — действующее вещество препарата. «Полный цикл» означает выпуск от субстанции до готовой формы.'],
  ['Готовая лекарственная форма (ГЛФ)','Финальный вид препарата для пациента: таблетка, ампула, капсула. «Локализация по ГЛФ» — финальные стадии производства в РФ.'],
  ['Биотех','Производство лекарств биологическими методами (живые клетки, белки, моноклональные антитела). Технологически сложнее химического синтеза.'],
  ['Моноклональные антитела','Биотехнологические белковые молекулы, прицельно связывающие мишень (например, опухолевые клетки). Основа современной онкологии и иммунологии.'],
  ['OTC / безрецептурные','Over-the-counter — препараты, отпускаемые без рецепта (от простуды, витамины, анальгетики). Продаются напрямую потребителю.'],
  ['Rx / рецептурные','Препараты, отпускаемые только по рецепту врача. Продвигаются через медицинских представителей, а не прямую рекламу.'],
  ['Пайплайн','Портфель препаратов компании на разных стадиях разработки и регистрации — показатель будущего роста.'],
  ['Клинические исследования (КИ)','Этапы проверки эффективности и безопасности препарата на людях (фазы I–III) перед регистрацией. Ключевая функция для R&D-компаний.'],
  ['Фармаконадзор','Система мониторинга безопасности лекарств после выхода на рынок (сбор данных о побочных эффектах). Обязательна для каждого производителя.'],
  ['ЕАЭС','Единый рынок лекарств Евразийского экономического союза. Регистрация по правилам ЕАЭС открывает доступ сразу в несколько стран.'],
];
function Glossary() {
  const [q,setQ]=useState('');
  const list = GLOSSARY.filter(([t,d])=>(t+d).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Словарь терминов</h1>
      <p className="text-slate2 text-sm mt-1.5">«Фарма для новичка» — базовые понятия для входа в отрасль</p>
      <div className="relative mt-4">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Найти термин…"
          className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-mint/40" />
        <svg className="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      </div>
      <div className="mt-5 space-y-2">
        {list.map(([t,d])=>(
          <details key={t} className="bg-white border border-slate-200 rounded-xl p-4 group" open={!!q}>
            <summary className="font-display font-bold flex items-center justify-between">{t}<span className="text-mint text-xl group-open:rotate-45 transition">+</span></summary>
            <p className="text-sm text-slate2 mt-2.5 leading-relaxed">{d}</p>
          </details>
        ))}
        {list.length===0 && <p className="text-slate-400 text-center py-8">Термин не найден.</p>}
      </div>
    </div>
  );
}

/* ============ ABOUT ============ */
function About() {
  return (
    <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">О проекте</h1>
      <div className="mt-5 space-y-3 text-slate2 leading-relaxed">
        <div className="bg-white border border-slate-200 rounded-xl p-5">
          <h3 className="font-display font-bold text-ink mb-2">Назначение</h3>
          <p>Справочник-навигатор по 100 крупнейшим фармацевтическим компаниям с производством или присутствием в России — для быстрого входа рекрутера в отрасль: масштаб, города производств, виды и названия препаратов, отзывы о работодателях и сравнение с Биокад.</p>
        </div>
        <div className="bg-white border border-slate-200 rounded-xl p-5">
          <h3 className="font-display font-bold text-ink mb-2">Методология и данные</h3>
          <p>Финансы и рейтинг — по Forbes и AlphaRM / RNC Pharma (2025). Сведения о заводах, городах, видах и названиях препаратов — из публичных источников. Где данные не раскрыты, стоит «н/д».</p>
          <p className="mt-2"><b>Отзывы сотрудников</b> — это обобщённое представление о типе работодателя (по происхождению, наличию R&D, сегментам), а не верифицированные мнения конкретных людей. Используйте их как ориентир, а не как факт.</p>
        </div>
        <div className="bg-white border border-slate-200 rounded-xl p-5">
          <h3 className="font-display font-bold text-ink mb-2">Как дополнять справочник</h3>
          <p>Данные о компаниях — в файле <code className="bg-slate-100 px-1.5 py-0.5 rounded text-sm">companies-data.js</code>. Скопируйте любой блок, вставьте в конец списка и замените значения — фильтры, список, сравнение и экспорт обновятся автоматически.</p>
        </div>
        <p className="text-sm text-slate-400">Данные приведены в иллюстративных целях и требуют проверки перед профессиональным использованием. Сборка: июнь 2026.</p>
      </div>
    </div>
  );
}

/* ============ ROOT ============ */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState({country:'all',prodOnly:false,rndOnly:false,region:'all',segment:'all',area:'all',sort:'revenue'});
  const [layout, setLayout] = useState('list');
  const [expandedId, setExpandedId] = useState(null);
  const [compareSel, setCompareSel] = useState(null);

  useEffect(()=>{
    const onHash = ()=>{ setRoute(parseHash()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);

  const navigate = useCallback((view, id, extra)=>{
    if (view==='compare' && extra!=null) setCompareSel(extra);
    location.hash = view==='company' && id!=null ? `#/company/${id}` : `#/${view}`;
  },[]);

  const { view, id } = route;
  const company = view==='company' ? DATA.find(c=>c.id===id) : null;

  return (
    <div className="min-h-screen flex flex-col">
      <Nav view={view} query={query} setQuery={setQuery} navigate={navigate} />
      <main className="flex-1">
        {view==='catalog' && <Catalog navigate={navigate} query={query} setQuery={setQuery} filters={filters} setFilters={setFilters} layout={layout} setLayout={setLayout} expandedId={expandedId} setExpandedId={setExpandedId} />}
        {view==='compare' && <Compare navigate={navigate} selId={compareSel} setSelId={setCompareSel} />}
        {view==='glossary' && <Glossary />}
        {view==='about' && <About />}
        {view==='company' && (company ? <CompanyPage c={company} navigate={navigate} /> :
          <div className="max-w-3xl mx-auto px-4 py-20 text-center text-slate2">Компания не найдена. <button onClick={()=>navigate('catalog')} className="text-teal underline">К каталогу</button></div>)}
      </main>
      <footer className="border-t border-slate-200 mt-12 py-7 no-print">
        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <span className="text-sm text-slate2"><b className="text-ink font-display">ФармаНавигатор</b> · справочник по фарм-отрасли России</span>
          <nav className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate2">
            {NAV.map(([k,l])=><button key={k} onClick={()=>navigate(k)} className="hover:text-teal">{l}</button>)}
          </nav>
        </div>
        <p className="max-w-7xl mx-auto px-4 mt-3 text-xs text-slate-400">100 компаний · данные в companies-data.js · «н/д» = публично не раскрыто · отзывы обобщённые. Сборка июнь 2026.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
