<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ФармаНавигатор — справочник по фарм-отрасли России</title>
<meta name="description" content="Справочник-навигатор по 100 крупнейшим фармацевтическим компаниям с производством и присутствием в России: масштаб, города производств, продуктовый портфель, ключевые препараты." />

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

<!-- Данные 100 компаний — редактируются в companies-data.js -->
<script src="companies-data.js"></script>

<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display:['Manrope','system-ui','sans-serif'], body:['Inter','system-ui','sans-serif'] },
      colors: { ink:'#0e2a3b', slate2:'#5b7282', mint:'#0fb5ba', teal:'#0e9aa0', sky:'#1d9bf0', paper:'#f4f9fa' },
      boxShadow: { soft:'0 1px 2px rgba(14,42,59,.05), 0 10px 30px rgba(14,42,59,.07)' },
    }},
  };
</script>

<style>
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;background:#f4f9fa;color:#0e2a3b}
  h1,h2,h3,h4{font-family:'Manrope',sans-serif;letter-spacing:-.015em}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#cfe3e6;border-radius:6px;border:3px solid #f4f9fa}
  ::-webkit-scrollbar-thumb:hover{background:#b6d6da}
  .fade-in{animation:fade .4s cubic-bezier(.2,.7,.3,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .stagger>*{animation:fade .4s cubic-bezier(.2,.7,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.04s}
  .stagger>*:nth-child(3){animation-delay:.06s}.stagger>*:nth-child(4){animation-delay:.08s}
  .stagger>*:nth-child(5){animation-delay:.10s}.stagger>*:nth-child(6){animation-delay:.12s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}html{scroll-behavior:auto}}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  [tabindex]:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #0fb5ba;outline-offset:2px;border-radius:8px}
  @media print{header,footer,.no-print{display:none!important}body{background:#fff}}
  mark{background:#cdeff0;color:inherit;padding:0 1px;border-radius:3px}
  .mesh{background:
    radial-gradient(60% 70% at 12% 0%, rgba(15,181,186,.14), transparent 60%),
    radial-gradient(50% 60% at 95% 5%, rgba(29,155,240,.10), transparent 55%);}
  .card-hover{transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s}
</style>
</head>
<body>
<div id="root">
  <div style="max-width:640px;margin:90px auto;padding:0 24px;font-family:Manrope,system-ui;text-align:center;color:#0e2a3b">
    <div style="font-size:42px">💊</div>
    <h1 style="font-size:22px;font-weight:800;margin:10px 0 8px">ФармаНавигатор загружается…</h1>
    <p style="color:#5b7282;font-size:14px;line-height:1.6">Если за 10–15 сек. ничего не появилось — обновите страницу (F5).</p>
  </div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback } = React;

const DATA = (window.PHARMA_COMPANIES || []).map((c, i) => ({ id: i, ...c }));

/* ============ helpers ============ */
const fmtRub = (v) => v == null ? "н/д" : v.toLocaleString('ru-RU') + " млрд ₽";
const fmtNum = (v) => (v === "н/д" || v == null) ? "н/д" : Number(v).toLocaleString('ru-RU');
const initials = (n) => n.replace(/[«»()]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const uniq = (a) => [...new Set(a)];
const cities = (c) => uniq((c.factories||[]).map(f=>f.city));
const ALL_SEGMENTS = uniq(DATA.flatMap(c => c.segments)).sort();
const ALL_REGIONS  = uniq(DATA.flatMap(c => c.regions)).sort((a,b)=>a.localeCompare(b,'ru'));
const ALL_AREAS    = uniq(DATA.flatMap(c => c.therapeuticAreas)).sort((a,b)=>a.localeCompare(b,'ru'));

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return <>{text.slice(0,i)}<mark>{text.slice(i,i+q.length)}</mark>{text.slice(i+q.length)}</>;
}

/* ============ tiny atoms ============ */
function Logo({ c, size=44 }) {
  return <div style={{width:size,height:size,background:c.logoColor||'#0fb5ba',fontSize:size*0.36}}
    className="rounded-xl flex items-center justify-center text-white font-display font-extrabold shrink-0 select-none">{initials(c.name)}</div>;
}
function Tag({ children, tone='mint', onClick, title }) {
  const tones = { mint:'bg-mint/10 text-teal', sky:'bg-sky/10 text-sky-700', gray:'bg-slate-100 text-slate2',
    green:'bg-emerald-50 text-emerald-700', amber:'bg-amber-50 text-amber-700', rose:'bg-rose-50 text-rose-600', ink:'bg-ink text-white' };
  const Cmp = onClick ? 'button' : 'span';
  return <Cmp onClick={onClick} title={title} className={`inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full ${tones[tone]} ${onClick?'hover:opacity-80 transition':''}`}>{children}</Cmp>;
}
function CountryBadge({ country }) {
  const map = { 'РФ':['green','🇷🇺 Российская'], 'Зарубеж':['sky','🌍 Зарубежная'], 'СП':['amber','🤝 Совместная'] };
  const [tone,label] = map[country] || ['gray', country];
  return <Tag tone={tone}>{label}</Tag>;
}
function RankBadge({ rank }) {
  if (!rank) return null;
  const top3 = rank<=3;
  return <span title="Позиция в рейтинге Forbes по итогам 2025 г."
    className={`inline-flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-full ${top3?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate2'}`}>
    {top3?'★':'#'}{rank} <span className="font-medium opacity-70">Forbes</span></span>;
}
function Stat({ value, label, sub, accent }) {
  return <div className="bg-white rounded-2xl p-4 md:p-5 shadow-soft relative overflow-hidden">
    {accent && <div className="absolute left-0 top-0 bottom-0 w-1" style={{background:accent}} />}
    <div className="text-2xl md:text-[26px] font-display font-extrabold leading-tight">{value}</div>
    <div className="text-sm text-slate2 mt-1">{label}</div>
    {sub && <div className="text-xs text-slate-400 mt-0.5">{sub}</div>}
  </div>;
}
function Section({ title, icon, children, action }) {
  return <div className="bg-white rounded-2xl p-5 md:p-6 shadow-soft">
    <div className="flex items-center justify-between gap-3 mb-4">
      <h3 className="font-display font-bold text-lg flex items-center gap-2"><span aria-hidden>{icon}</span>{title}</h3>
      {action}
    </div>
    {children}
  </div>;
}
function Cities({ c, max }) {
  const list = cities(c);
  if (!list.length) return <span className="text-slate-400">нет производства в РФ</span>;
  const shown = max ? list.slice(0,max) : list;
  return <span>🏭 {shown.join(' · ')}{max && list.length>max ? ` +${list.length-max}` : ''}</span>;
}

/* ============ routing (hash based) ============ */
function parseHash() {
  const h = (location.hash||'#/').replace(/^#/,'');
  const parts = h.split('/').filter(Boolean);
  if (parts[0]==='company' && parts[1]!=null) return { view:'company', id:Number(parts[1]) };
  const known = ['catalog','compare','glossary','about'];
  return { view: known.includes(parts[0])?parts[0]:'catalog', id:null };
}

/* ============ NAV ============ */
const NAV = [['catalog','Каталог'],['compare','Сравнение'],['glossary','Словарь'],['about','О проекте']];
function Nav({ view, query, setQuery, navigate }) {
  const [open, setOpen] = useState(false);
  const active = view==='company' ? 'catalog' : view;
  return (
    <header className="sticky top-0 z-[1000] bg-white/85 backdrop-blur-md border-b border-slate-100 no-print">
      <div className="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
        <button onClick={()=>navigate('catalog')} className="flex items-center gap-2 shrink-0">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-mint to-sky flex items-center justify-center text-white font-display font-extrabold shadow-sm">Ф</div>
          <span className="font-display font-extrabold text-lg hidden sm:block">ФармаНавигатор</span>
        </button>
        <nav className="hidden md:flex items-center gap-0.5 ml-2">
          {NAV.map(([k,l]) => (
            <button key={k} onClick={()=>navigate(k)} aria-current={active===k?'page':undefined}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${active===k?'bg-mint/10 text-teal':'text-slate2 hover:text-ink hover:bg-slate-50'}`}>{l}</button>
          ))}
        </nav>
        <div className="flex-1" />
        <div className="relative hidden sm:block">
          <input value={query} onChange={e=>{setQuery(e.target.value); if(e.target.value && active!=='catalog') navigate('catalog');}}
            placeholder="Поиск компании…" aria-label="Поиск компании"
            className="w-44 lg:w-64 pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-mint/40 focus:border-mint" />
          <svg className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        </div>
        <button onClick={()=>setOpen(!open)} className="md:hidden p-2 rounded-lg hover:bg-slate-50" aria-label="Меню" aria-expanded={open}>
          <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d={open?"M6 6l12 12M6 18L18 6":"M4 6h16M4 12h16M4 18h16"}/></svg>
        </button>
      </div>
      {open && (
        <div className="md:hidden border-t border-slate-100 px-4 py-3 grid grid-cols-2 gap-2 bg-white">
          {NAV.map(([k,l]) => (
            <button key={k} onClick={()=>{navigate(k); setOpen(false);}}
              className={`px-3 py-2 rounded-lg text-sm font-medium text-left ${active===k?'bg-mint/10 text-teal':'text-slate2 hover:bg-slate-50'}`}>{l}</button>
          ))}
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск…" aria-label="Поиск"
            className="col-span-2 mt-1 px-3 py-2 rounded-lg border border-slate-200 text-sm" />
        </div>
      )}
    </header>
  );
}

/* ============ CATALOG: card (grid) ============ */
function CompanyCard({ c, onOpen, query }) {
  return (
    <button onClick={()=>onOpen(c.id)} className="text-left bg-white rounded-2xl p-5 shadow-soft border border-transparent card-hover hover:-translate-y-1 hover:shadow-lg hover:border-mint/30 w-full group">
      <div className="flex items-start gap-3">
        <Logo c={c} />
        <div className="min-w-0 flex-1">
          <div className="font-display font-bold text-ink truncate group-hover:text-teal transition">{highlight(c.name, query)}</div>
          <div className="mt-1.5 flex flex-wrap gap-1.5 items-center">
            <CountryBadge country={c.country} />
            {c.marketRank && <RankBadge rank={c.marketRank} />}
          </div>
        </div>
      </div>
      <div className="mt-4 grid grid-cols-2 gap-2 text-sm">
        <div><div className="text-slate-400 text-xs">Выручка в РФ</div><div className="font-semibold">{fmtRub(c.revenue)}</div></div>
        <div><div className="text-slate-400 text-xs">Сотрудники РФ</div><div className="font-semibold">{fmtNum(c.employeesRussia)}</div></div>
      </div>
      <div className="mt-3 text-xs text-slate2 truncate"><Cities c={c} max={3} /></div>
      <div className="mt-2 text-xs text-slate2"><span className="text-slate-400">💊 Препараты: </span>{c.keyProducts.slice(0,2).join(', ')}{c.keyProducts.length>2?'…':''}</div>
      <div className="mt-3 flex flex-wrap gap-1.5">
        {c.hasProductionInRussia && <Tag tone="green">Завод в РФ</Tag>}
        {c.segments.slice(0,2).map(s=><Tag key={s} tone="gray">{s}</Tag>)}
        {c.segments.length>2 && <Tag tone="gray">+{c.segments.length-2}</Tag>}
      </div>
    </button>
  );
}

/* ============ CATALOG: row (list) ============ */
function CompanyRow({ c, onOpen, query }) {
  return (
    <button onClick={()=>onOpen(c.id)} className="text-left w-full bg-white card-hover hover:bg-mint/5 border-b border-slate-100 last:border-0 px-4 py-3.5 flex items-center gap-4 group">
      <Logo c={c} size={40} />
      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="font-display font-bold text-ink truncate group-hover:text-teal transition">{highlight(c.name, query)}</span>
          <CountryBadge country={c.country} />
          {c.marketRank && <RankBadge rank={c.marketRank} />}
        </div>
        <div className="text-xs text-slate2 mt-1 truncate"><Cities c={c} max={4} /></div>
        <div className="text-xs text-slate2 mt-0.5 truncate"><span className="text-slate-400">💊 </span>{c.keyProducts.slice(0,3).join(', ')}{c.keyProducts.length>3?'…':''}</div>
      </div>
      <div className="hidden md:flex flex-wrap gap-1.5 w-44 shrink-0">
        {c.segments.slice(0,3).map(s=><Tag key={s} tone="gray">{s}</Tag>)}
      </div>
      <div className="hidden sm:block text-right w-28 shrink-0">
        <div className="text-sm font-bold text-ink">{fmtRub(c.revenue)}</div>
        <div className="text-xs text-slate-400">{fmtNum(c.employeesRussia)} чел. в РФ</div>
      </div>
      <svg className="w-4 h-4 text-slate-300 group-hover:text-teal shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  );
}

function Catalog({ navigate, query, setQuery, filters, setFilters, layout, setLayout }) {
  const { country, prodOnly, rndOnly, region, segment, area, sort } = filters;
  const set = (k,v)=> setFilters({...filters,[k]:v});

  const filtered = useMemo(()=>{
    let list = DATA.filter(c=>{
      const hay = (c.name+' '+c.fullName+' '+c.keyProducts.join(' ')).toLowerCase();
      if (query && !hay.includes(query.toLowerCase())) return false;
      if (country!=='all' && c.country!==country) return false;
      if (prodOnly && !c.hasProductionInRussia) return false;
      if (rndOnly && !c.hasRnD) return false;
      if (region!=='all' && !c.regions.includes(region)) return false;
      if (segment!=='all' && !c.segments.includes(segment)) return false;
      if (area!=='all' && !c.therapeuticAreas.includes(area)) return false;
      return true;
    });
    const num = v => (typeof v==='number'?v:0);
    list.sort((a,b)=>{
      if (sort==='revenue') return (b.revenue??-1)-(a.revenue??-1);
      if (sort==='employees') return num(b.employeesRussia)-num(a.employeesRussia);
      if (sort==='factories') return cities(b).length-cities(a).length;
      if (sort==='rank') return (a.marketRank??999)-(b.marketRank??999);
      if (sort==='name') return a.name.localeCompare(b.name,'ru');
      return 0;
    });
    return list;
  },[query,country,prodOnly,rndOnly,region,segment,area,sort]);

  const activeChips = [];
  if (country!=='all') activeChips.push(['Происхождение: '+country, ()=>set('country','all')]);
  if (region!=='all') activeChips.push(['Регион: '+region, ()=>set('region','all')]);
  if (segment!=='all') activeChips.push(['Сегмент: '+segment, ()=>set('segment','all')]);
  if (area!=='all') activeChips.push(['Область: '+area, ()=>set('area','all')]);
  if (prodOnly) activeChips.push(['Только с заводом в РФ', ()=>set('prodOnly',false)]);
  if (rndOnly) activeChips.push(['Только с R&D в РФ', ()=>set('rndOnly',false)]);
  if (query) activeChips.push(['Поиск: "'+query+'"', ()=>setQuery('')]);

  const reset = ()=>{ setFilters({country:'all',prodOnly:false,rndOnly:false,region:'all',segment:'all',area:'all',sort}); setQuery(''); };

  const exportCSV = ()=>{
    const head = ['Название','Полное название','Происхождение','Города производства','Регионы','Выручка РФ (млрд ₽)','Сотрудники РФ','Сегменты','Терапевт. области','Ключевые препараты','R&D в РФ','Сайт'];
    const rows = filtered.map(c=>[c.name,c.fullName,c.country,cities(c).join('; '),c.regions.join('; '),c.revenue??'',c.employeesRussia,c.segments.join('; '),c.therapeuticAreas.join('; '),c.keyProducts.join('; '),c.hasRnD?'Да':'Нет',c.website||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = '﻿'+[head.join(','),...rows].join('\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a = document.createElement('a'); a.href=url; a.download='pharma-companies.csv'; a.click(); URL.revokeObjectURL(url);
  };

  const Sel = ({value,onChange,children,label}) => (
    <label className="block">
      <span className="text-xs text-slate-400">{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)}
        className="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-mint/40">{children}</select>
    </label>
  );

  return (
    <div className="fade-in">
      <section className="mesh border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 pt-8 pb-6">
          <h1 className="text-2xl md:text-4xl font-display font-extrabold">Справочник фарм-компаний России</h1>
          <p className="text-slate2 mt-2 max-w-2xl">100 крупнейших игроков отрасли: масштаб, города производств, продуктовый портфель и ключевые препараты. Фильтруйте, ищите и сравнивайте.</p>
        </div>
      </section>

      <div className="max-w-7xl mx-auto px-4 py-6">
        <div className="flex items-end justify-between gap-3 flex-wrap mb-5">
          <div>
            <p className="text-slate2 text-sm"><span className="font-bold text-ink text-lg">{filtered.length}</span> из {DATA.length} компаний</p>
          </div>
          <div className="flex gap-2 items-end">
            <div className="hidden sm:flex items-center rounded-xl border border-slate-200 p-0.5 bg-white" role="group" aria-label="Вид">
              <button onClick={()=>setLayout('list')} aria-pressed={layout==='list'} title="Списком"
                className={`p-2 rounded-lg transition ${layout==='list'?'bg-mint/10 text-teal':'text-slate-400 hover:text-ink'}`}>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              </button>
              <button onClick={()=>setLayout('grid')} aria-pressed={layout==='grid'} title="Плиткой"
                className={`p-2 rounded-lg transition ${layout==='grid'?'bg-mint/10 text-teal':'text-slate-400 hover:text-ink'}`}>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              </button>
            </div>
            <button onClick={exportCSV} className="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium hover:border-mint flex items-center gap-1.5" title="Скачать отфильтрованный список в CSV">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>CSV
            </button>
            <Sel value={sort} onChange={v=>set('sort',v)} label="Сортировка">
              <option value="revenue">По выручке</option>
              <option value="rank">По рейтингу Forbes</option>
              <option value="employees">По сотрудникам</option>
              <option value="factories">По числу городов</option>
              <option value="name">По названию</option>
            </Sel>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-4 bg-white p-4 rounded-2xl shadow-soft">
          <Sel value={country} onChange={v=>set('country',v)} label="Происхождение">
            <option value="all">Все</option><option value="РФ">Российские</option><option value="Зарубеж">Зарубежные</option><option value="СП">Совместные</option>
          </Sel>
          <Sel value={region} onChange={v=>set('region',v)} label="Регион">
            <option value="all">Все регионы</option>{ALL_REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
          </Sel>
          <Sel value={segment} onChange={v=>set('segment',v)} label="Сегмент">
            <option value="all">Все сегменты</option>{ALL_SEGMENTS.map(s=><option key={s} value={s}>{s}</option>)}
          </Sel>
          <Sel value={area} onChange={v=>set('area',v)} label="Терапевт. область">

/* ============ COMPARE ============ */
function Compare({ navigate, picked, setPicked }) {
  const toggle = (id)=> setPicked(picked.includes(id) ? picked.filter(x=>x!==id) : (picked.length<4 ? [...picked,id] : picked));
  const cols = picked.map(id=>DATA.find(c=>c.id===id)).filter(Boolean);
  const best = (vals, fn) => { const nums = vals.map(fn).filter(v=>typeof v==='number'); return nums.length?Math.max(...nums):null; };
  const rows = [
    ['Происхождение', c=>c.country, false],
    ['Статус', c=>c.status, false],
    ['Выручка в РФ, млрд ₽', c=>c.revenue, true],
    ['Сотрудники в РФ', c=>typeof c.employeesRussia==='number'?c.employeesRussia:c.employeesRussia, true],
    ['Сотрудники глобально', c=>typeof c.employeesGlobal==='number'?c.employeesGlobal:c.employeesGlobal, true],
    ['На рынке РФ с', c=>c.yearEnteredRussia, false],
    ['Городов производства', c=>cities(c).length, true],
    ['Города', c=>cities(c).join(', ')||'н/д', false],
    ['Регионы', c=>c.regions.join(', ')||'н/д', false],
    ['Сегменты', c=>c.segments.join(', '), false],
    ['Терапевт. области', c=>c.therapeuticAreas.join(', '), false],
    ['Ключевые препараты', c=>c.keyProducts.join(', '), false],
    ['R&D в РФ', c=>c.hasRnD?'Да':'Нет', false],
  ];

  return (
    <div className="max-w-7xl mx-auto px-4 py-8 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Сравнение компаний</h1>
      <p className="text-slate2 text-sm mt-1">Выберите от 2 до 4 компаний · лучшее значение в строке подсвечивается</p>

      <div className="mt-5 flex flex-wrap gap-2 max-h-44 overflow-y-auto p-1">
        {DATA.map(c=>{
          const on = picked.includes(c.id), disabled = picked.length>=4&&!on;
          return <button key={c.id} onClick={()=>toggle(c.id)} disabled={disabled}
            className={`px-3 py-1.5 rounded-full text-sm font-medium border transition ${on?'bg-ink text-white border-ink':'bg-white border-slate-200 hover:border-mint'} ${disabled?'opacity-40 cursor-not-allowed':''}`}>
            {on&&'✓ '}{c.name}</button>;
        })}
      </div>

      {cols.length>=2 ? (
        <div className="mt-6 overflow-x-auto bg-white rounded-2xl shadow-soft">
          <table className="w-full text-sm min-w-[640px]">
            <thead>
              <tr className="border-b border-slate-100">
                <th className="text-left p-4 text-slate-400 font-medium w-48 sticky left-0 bg-white">Параметр</th>
                {cols.map(c=>(
                  <th key={c.id} className="text-left p-4">
                    <button onClick={()=>navigate('company',c.id)} className="flex items-center gap-2 hover:text-teal">
                      <Logo c={c} size={32} /><span className="font-display font-bold">{c.name}</span>
                    </button>
                    <button onClick={()=>toggle(c.id)} className="text-xs text-slate-400 hover:text-rose-500 mt-1">убрать ×</button>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map(([label,fn,isNum],i)=>{
                const top = isNum ? best(cols,fn) : null;
                return (
                  <tr key={i} className={i%2?'bg-slate-50/50':''}>
                    <td className="p-4 text-slate-400 align-top sticky left-0 bg-inherit">{label}</td>
                    {cols.map(c=>{
                      const v = fn(c);
                      const isBest = isNum && top!=null && v===top && cols.filter(x=>fn(x)===top).length<cols.length;
                      const display = isNum && typeof v==='number' ? v.toLocaleString('ru-RU') : (v==='н/д'||v==null?'н/д':v);
                      return <td key={c.id} className="p-4 align-top">
                        <span className={isBest?'font-bold text-teal':''}>{display}{isBest&&' ★'}</span>
                      </td>;
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="mt-6 bg-white rounded-2xl p-12 text-center shadow-soft text-slate2">
          <div className="text-4xl mb-2">⇄</div>
          Отметьте минимум 2 компании выше, чтобы увидеть таблицу сравнения.
        </div>
      )}
    </div>
  );
}

/* ============ GLOSSARY ============ */
const GLOSSARY = [
  ['GMP','Good Manufacturing Practice — надлежащая производственная практика. Международный стандарт качества и безопасности производства лекарств. Сертификат GMP — обязательное условие для легального выпуска препаратов.'],
  ['Дженерик','Воспроизведённый аналог оригинального препарата с тем же действующим веществом, выпускаемый после истечения патента. Дешевле оригинала, биоэквивалентен ему.'],
  ['Оригинальный препарат','Лекарство, впервые разработанное и выведенное на рынок компанией-разработчиком; защищено патентом. Требует полного цикла клинических исследований.'],
  ['Биоаналог (биосимиляр)','Аналог биологического (например, белкового) препарата. В отличие от химического дженерика, не идентичен, а «подобен» оригиналу из-за сложности биопроизводства.'],
  ['R&D','Research & Development — исследования и разработки. Подразделения, создающие новые молекулы и препараты. Наличие R&D в РФ — признак компании полного цикла.'],
  ['Локализация','Перенос производства (полностью или частично — упаковка, готовая форма) на территорию России. Даёт доступ к госзакупкам и преференции по ЖНВЛП.'],
  ['Регистрационное удостоверение (РУ)','Документ Минздрава, разрешающий обращение конкретного препарата в РФ. Число РУ в портфеле — показатель широты ассортимента компании.'],
  ['ЖНВЛП','Жизненно необходимые и важнейшие лекарственные препараты — перечень, цены на который регулируются государством. Попадание в ЖНВЛП важно для госзакупок.'],
  ['АФИ / субстанция','Активный фармацевтический ингредиент — действующее вещество препарата. «Полный цикл» означает выпуск от субстанции до готовой формы.'],
  ['Готовая лекарственная форма (ГЛФ)','Финальный вид препарата для пациента: таблетка, ампула, капсула. «Локализация по ГЛФ» — финальные стадии производства в РФ.'],
  ['Биотех','Производство лекарств биологическими методами (живые клетки, белки, моноклональные антитела). Технологически сложнее химического синтеза.'],
  ['Моноклональные антитела','Биотехнологические белковые молекулы, прицельно связывающие мишень (например, опухолевые клетки). Основа современной онкологии и иммунологии.'],
  ['Офсетный контракт','Соглашение между компанией и регионом: инвестиции в завод в обмен на гарантированный долгосрочный госзаказ.'],
  ['OTC / безрецептурные','Over-the-counter — препараты, отпускаемые без рецепта (от простуды, витамины, анальгетики). Продаются напрямую потребителю.'],
  ['Rx / рецептурные','Препараты, отпускаемые только по рецепту врача. Продвигаются через медицинских представителей, а не прямую рекламу.'],
  ['Пайплайн','Портфель препаратов компании на разных стадиях разработки и регистрации — показатель будущего роста.'],
  ['Клинические исследования (КИ)','Этапы проверки эффективности и безопасности препарата на людях (фазы I–III) перед регистрацией. Ключевая функция для R&D-компаний.'],
  ['Фармаконадзор','Система мониторинга безопасности лекарств после выхода на рынок (сбор данных о побочных эффектах). Обязательна для каждого производителя.'],
  ['ЕАЭС','Единый рынок лекарств Евразийского экономического союза. Регистрация по правилам ЕАЭС открывает доступ сразу в несколько стран.'],
];
function Glossary() {
  const [q,setQ]=useState('');
  const list = GLOSSARY.filter(([t,d])=>(t+d).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="max-w-3xl mx-auto px-4 py-8 fade-in">
      <h1 className="text-2xl md:text-3xl font-display font-extrabold">Словарь терминов</h1>
      <p className="text-slate2 text-sm mt-1">«Фарма для новичка» — базовые понятия для входа в отрасль</p>
      <div className="relative mt-4">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Найти термин…"
          className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-mint/40" />
        <svg className="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      </div>
      <div className="mt-5 space-y-2">
        {list.map(([t,d])=>(
          <details key={t} className="bg-white rounded-2xl shadow-soft p-5 group" open={!!q}>
            <summary className="font-display font-bold flex items-center justify-between">{t}<span className="text-mint text-xl group-open:rotate-45 transition">+</span></summary>
            <p className="text-sm text-slate2 mt-3 leading-relaxed">{d}</p>
          </details>
        ))}
        {list.length===0 && <p className="text-slate-400 text-center py-8">Термин не найден.</p>}
      </div>
    </div>
  );
}

        <div className="bg-white rounded-2xl p-6 shadow-soft">
          <h3 className="font-display font-bold text-ink mb-2">Как дополнять справочник</h3>
          <p>Все данные о компаниях — в одном файле <code className="bg-slate-100 px-1.5 py-0.5 rounded text-sm">companies-data.js</code>. Чтобы добавить компанию, скопируйте любой блок, вставьте в конец списка и замените значения. Код сайта менять не нужно: фильтры, список, сравнение и экспорт обновятся автоматически.</p>
        </div>
        <p className="text-sm text-slate-400">Данные приведены в иллюстративных целях и требуют проверки перед профессиональным использованием. Сборка: июнь 2026.</p>
      </div>
    </div>
  );
}

/* ============ ROOT ============ */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState({country:'all',prodOnly:false,rndOnly:false,region:'all',segment:'all',area:'all',sort:'revenue'});
  const [layout, setLayout] = useState('list');
  const [picked, setPicked] = useState([]);

  useEffect(()=>{
    const onHash = ()=>{ setRoute(parseHash()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);

  const navigate = useCallback((view, id)=>{
    location.hash = view==='company' && id!=null ? `#/company/${id}` : `#/${view}`;
  },[]);

  const { view, id } = route;
  const company = view==='company' ? DATA.find(c=>c.id===id) : null;

  return (
    <div className="min-h-screen flex flex-col">
      <Nav view={view} query={query} setQuery={setQuery} navigate={navigate} />
      <main className="flex-1">
        {view==='catalog' && <Catalog navigate={navigate} query={query} setQuery={setQuery} filters={filters} setFilters={setFilters} layout={layout} setLayout={setLayout} />}
        {view==='compare' && <Compare navigate={navigate} picked={picked} setPicked={setPicked} />}
        {view==='glossary' && <Glossary />}
        {view==='about' && <About />}
        {view==='company' && (company ? <CompanyPage c={company} navigate={navigate} /> :
          <div className="max-w-3xl mx-auto px-4 py-20 text-center text-slate2">Компания не найдена. <button onClick={()=>navigate('catalog')} className="text-teal underline">К каталогу</button></div>)}
      </main>
      <footer className="border-t border-slate-100 mt-12 py-8 no-print">
        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-mint to-sky flex items-center justify-center text-white font-display font-extrabold text-sm">Ф</div>
            <span className="text-sm text-slate2"><b className="text-ink font-display">ФармаНавигатор</b> · справочник по фарм-отрасли России</span>
          </div>
          <nav className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate2">
            {NAV.map(([k,l])=><button key={k} onClick={()=>navigate(k)} className="hover:text-teal">{l}</button>)}
          </nav>
        </div>
        <p className="max-w-7xl mx-auto px-4 mt-4 text-xs text-slate-400">100 компаний · данные редактируются в companies-data.js · «н/д» = публично не раскрыто. Сборка июнь 2026, требует проверки перед профессиональным использованием.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
