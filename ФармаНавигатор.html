const GLOSSARY = [['GMP', 'Good Manufacturing Practice — надлежащая производственная практика. Международный стандарт качества и безопасности производства лекарств. Сертификат GMP — обязательное условие для легального выпуска препаратов.'], ['Цикл разработки лекарства', 'Путь препарата: поиск мишени и молекулы → доклинические исследования (на клетках и животных) → клинические исследования фаз I–III на людях → регистрация и получение РУ → выпуск и пострегистрационный надзор (фаза IV). В среднем занимает 10–15 лет и миллиарды рублей; до рынка доходят единицы молекул из тысяч.'], ['Фазы клинических исследований', 'Фаза I — безопасность на небольшой группе (часто здоровые добровольцы); фаза II — эффективность и подбор доз на пациентах; фаза III — крупные сравнительные исследования перед регистрацией; фаза IV — наблюдение уже после выхода на рынок.'], ['Доклинические исследования', 'Изучение препарата в лаборатории и на животных до испытаний на людях: токсичность, фармакокинетика, безопасность. Обязательный этап перед клиническими исследованиями.'], ['Минздрав России', 'Министерство здравоохранения РФ — регистрирует лекарства (выдаёт регистрационное удостоверение), утверждает перечни (ЖНВЛП) и правила обращения лекарственных средств.'], ['Росздравнадзор', 'Федеральная служба по надзору в сфере здравоохранения — контроль качества лекарств на рынке, фармаконадзор, проверки производителей, изъятие недоброкачественных серий.'], ['НЦЭСМП', 'ФГБУ «Научный центр экспертизы средств медицинского применения» Минздрава — проводит экспертизу качества, эффективности и безопасности препаратов при их регистрации.'], ['FDA / EMA', 'Зарубежные регуляторы: FDA (США) и EMA (Евросоюз) выдают разрешения на лекарства на своих рынках и задают мировые стандарты. В ЕАЭС действует собственная процедура регистрации.'], ['Дженерик', 'Воспроизведённый аналог оригинального препарата с тем же действующим веществом, выпускаемый после истечения патента. Дешевле оригинала, биоэквивалентен ему.'], ['Оригинальный препарат', 'Лекарство, впервые разработанное и выведенное на рынок компанией-разработчиком; защищено патентом. Требует полного цикла клинических исследований.'], ['Биоаналог (биосимиляр)', 'Аналог биологического (например, белкового) препарата. В отличие от химического дженерика, не идентичен, а «подобен» оригиналу из-за сложности биопроизводства.'], ['R&D', 'Research & Development — исследования и разработки. Подразделения, создающие новые молекулы и препараты. Наличие R&D в РФ — признак компании полного цикла.'], ['Локализация', 'Перенос производства (полностью или частично — упаковка, готовая форма) на территорию России. Даёт доступ к госзакупкам и преференции по ЖНВЛП.'], ['Регистрационное удостоверение (РУ)', 'Документ Минздрава, разрешающий обращение конкретного препарата в РФ. Число РУ в портфеле — показатель широты ассортимента компании.'], ['ЖНВЛП', 'Жизненно необходимые и важнейшие лекарственные препараты — перечень, цены на который регулируются государством. Попадание в ЖНВЛП важно для госзакупок.'], ['АФИ / субстанция', 'Активный фармацевтический ингредиент — действующее вещество препарата. «Полный цикл» означает выпуск от субстанции до готовой формы.'], ['Готовая лекарственная форма (ГЛФ)', 'Финальный вид препарата для пациента: таблетка, ампула, капсула. «Локализация по ГЛФ» — финальные стадии производства в РФ.'], ['Биотех', 'Производство лекарств биологическими методами (живые клетки, белки, моноклональные антитела). Технологически сложнее химического синтеза.'], ['Моноклональные антитела', 'Биотехнологические белковые молекулы, прицельно связывающие мишень (например, опухолевые клетки). Основа современной онкологии и иммунологии.'], ['OTC / безрецептурные', 'Over-the-counter — препараты, отпускаемые без рецепта (от простуды, витамины, анальгетики). Продаются напрямую потребителю.'], ['Rx / рецептурные', 'Препараты, отпускаемые только по рецепту врача. Продвигаются через медицинских представителей, а не прямую рекламу.'], ['Пайплайн', 'Портфель препаратов компании на разных стадиях разработки и регистрации — показатель будущего роста.'], ['Фармаконадзор', 'Система мониторинга безопасности лекарств после выхода на рынок (сбор данных о побочных эффектах). Обязательна для каждого производителя.'], ['ЕАЭС (регистрация)', 'Единая процедура регистрации лекарств в Евразийском экономическом союзе — одно досье открывает доступ на рынки стран-участниц.']];
